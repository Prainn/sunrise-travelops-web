name: Deploy frontend
run-name: ${{ inputs.operation || 'deploy' }} frontend ${{ github.ref_name }} ${{ github.sha }} ${{ inputs.request_id }}
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional exact commit required by the local dev launcher
        type: string
        default: ''
      request_id:
        description: Local launcher request identifier
        type: string
        default: ''
      operation:
        description: Deploy this branch or roll back a retained verified release
        type: choice
        options: [deploy, rollback]
        default: deploy
      release:
        description: Rollback release ID, or previous
        type: string
        default: previous
permissions:
  contents: read
concurrency:
  group: frontend-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ready:
    if: github.repository == 'Prainn/sunrise-travelops-web' && (github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      verified_dev_sha: ${{ steps.verify-dev.outputs.sha }}
    steps:
      - name: Require registered runner and branch protections before cutover
        env:
          READY: ${{ vars.SELF_HOSTED_READY }}
        run: test "$READY" = true || { echo 'Self-hosted cutover not ready; registration and branch protections required'; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: github.ref == 'refs/heads/dev' && (inputs.operation || 'deploy') == 'deploy'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        if: github.ref == 'refs/heads/dev' && (inputs.operation || 'deploy') == 'deploy'
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: github.ref == 'refs/heads/dev' && (inputs.operation || 'deploy') == 'deploy'
        with:
          node-version: '24.22.1'
          cache: pnpm
      - name: Type-check exact dev candidate on GitHub
        if: github.ref == 'refs/heads/dev' && (inputs.operation || 'deploy') == 'deploy'
        id: verify-dev
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || '' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$EXPECTED_SHA" || test "$EXPECTED_SHA" = "$GITHUB_SHA"
          pnpm install --frozen-lockfile
          pnpm type-check
          printf 'sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
  deploy:
    needs: ready
    runs-on: [self-hosted, Linux, X64, sunrise-frontend]
    timeout-minutes: ${{ github.ref_name == 'dev' && 35 || 60 }}
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      OPERATION: ${{ inputs.operation || 'deploy' }}
      ROLLBACK_RELEASE: ${{ inputs.release || 'previous' }}
      EXPECTED_SHA: ${{ inputs.expected_sha || '' }}
      NODE_OPTIONS: --max-old-space-size=1400
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Supervised frontend dev release
        if: github.ref == 'refs/heads/dev'
        shell: bash
        env:
          SUNRISE_HOSTED_DEV_TYPECHECK_SHA: ${{ needs.ready.outputs.verified_dev_sha }}
        run: |
          set -euo pipefail
          if [[ "$OPERATION" == deploy ]]; then
            test "$SUNRISE_HOSTED_DEV_TYPECHECK_SHA" = "$GITHUB_SHA" || { echo 'Exact dev candidate has not passed hosted type-check'; exit 1; }
          fi
          export PATH="/opt/sunrise-ci/node/bin:$PATH"
          python3 /opt/sunrise-ci/frontend-dev-guard/dev_release_guard.py run
      - name: Serialized build, release or rollback
        if: github.ref != 'refs/heads/dev'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/sunrise-ci/node/bin:$PATH"
          exec 9>/opt/sunrise-ci/build.lock
          flock -w 2700 9
          export SUNRISE_LOCK_HELD=1
          test -z "$EXPECTED_SHA" || test "$EXPECTED_SHA" = "$GITHUB_SHA"
          # Re-read the branch after waiting; never activate an obsolete queued commit.
          remote=$(curl --fail --silent --show-error --retry 2 --connect-timeout 10 --max-time 60 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          test "$remote" = "$GITHUB_SHA" || { echo 'Branch advanced while queued; rerun its current commit'; exit 1; }
          source=$(mktemp -d "$RUNNER_TEMP/sunrise-source.XXXXXX")
          trap 'rm -rf -- "$source"' EXIT
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 120 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" -o "$source/repository.tgz"
          tar -xzf "$source/repository.tgz" --strip-components=1 -C "$source"
          rm "$source/repository.tgz"
          cd "$source"
          base="/opt/sunrise-travelops-$DEPLOY_ENV"
          if [[ "$OPERATION" == rollback ]]; then
            python3 scripts/deploy.py rollback "$ROLLBACK_RELEASE"
            exit 0
          fi
          if python3 - "$base" "$GITHUB_SHA" <<'PYCODE'
          import json, sys
          from pathlib import Path
          base, sha = Path(sys.argv[1]), sys.argv[2]
          file = base / 'frontend/last-deployment.json'
          state = json.loads(file.read_text()) if file.exists() else {}
          current = state.get('current', state.get('release', ''))
          sys.exit(0 if current.startswith(sha + '-') else 1)
          PYCODE
          then
            echo "This commit is already deployed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/test_deploy.py
          release="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          pnpm install --frozen-lockfile --store-dir /opt/sunrise-ci/pnpm-store
          NODE_OPTIONS=--max-old-space-size=1200 node scripts/type-check.mjs
          pnpm exec vite build --mode "server-$DEPLOY_ENV"
          python3 scripts/deploy.py deploy "$release" dist
          python3 scripts/deploy.py status >> "$GITHUB_STEP_SUMMARY"
