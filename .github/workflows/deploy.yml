name: Deploy frontend
run-name: ${{ inputs.operation || 'deploy' }} frontend ${{ github.ref_name }} ${{ github.sha }} ${{ inputs.request_id }}
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional exact commit required by the local dev launcher
        type: string
        default: ''
      request_id:
        description: Local launcher request identifier
        type: string
        default: ''
      operation:
        description: Deploy this branch or roll back a retained verified release
        type: choice
        options: [deploy, stage, rollback]
        default: deploy
      release:
        description: Rollback release ID, or previous
        type: string
        default: previous
permissions:
  contents: read
concurrency:
  group: frontend-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ready:
    if: github.repository == 'Prainn/sunrise-travelops-web' && (github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate release request
        env:
          READY: ${{ vars.SELF_HOSTED_READY }}
          EXPECTED: ${{ inputs.expected_sha }}
          OPERATION: ${{ inputs.operation || 'deploy' }}
        run: |
          test "$READY" = true
          test -z "$EXPECTED" || test "$EXPECTED" = "$GITHUB_SHA"
          test "$OPERATION" != stage || test "$GITHUB_REF_NAME" = main
  deploy:
    needs: ready
    if: github.ref == 'refs/heads/dev'
    runs-on: [sunrise-dev-frontend]
    timeout-minutes: 70
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      SUNRISE_ACTIVATION_SCOPE: ${{ github.ref_name == 'dev' && 'live' || '' }}
      OPERATION: ${{ inputs.operation || 'deploy' }}
      ROLLBACK_RELEASE: ${{ inputs.release || 'previous' }}
      EXPECTED_SHA: ${{ inputs.expected_sha || '' }}
      NODE_OPTIONS: --max-old-space-size=1400
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Supervised frontend dev release
        id: release
        if: github.ref == 'refs/heads/dev'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/sunrise-ci/node/bin:$PATH"
          test "$(hostname)" = iZbp1j5n14ce3c01o1539cZ || { echo 'Incorrect dev build host'; exit 1; }
          current=/opt/sunrise-travelops-dev/frontend/current
          expected="releases/${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          previous=$(readlink "$current" || true)
          start_ms=$(date +%s%3N)
          python3 /opt/sunrise-ci/frontend-dev-guard/dev_release_guard.py run
          if [[ "$OPERATION" == deploy && "$previous" != "$expected" && "$(readlink "$current")" == "$expected" ]]; then
            echo "backfill_start=$start_ms" >> "$GITHUB_OUTPUT"
            echo "backfill_end=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
          fi
      - name: Reconcile WhatsApp inbound after activation
        if: steps.release.outputs.backfill_start != ''
        shell: bash
        env:
          START_MS: ${{ steps.release.outputs.backfill_start }}
          END_MS: ${{ steps.release.outputs.backfill_end }}
        run: |
          set -euo pipefail
          key="frontend-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # The verified API image supplies the utility. Only the host has the dev ECS role.
          if receipt=$(docker exec sunrise-travelops-dev-api-1 cat /app/dist/whatsapp-backfill.cjs |
              timeout 120 /opt/sunrise-ci/node/bin/node - --dev "$key" "$START_MS" "$END_MS"); then
            echo "WhatsApp backfill receipt $receipt" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::WhatsApp backfill incomplete; retry $key $START_MS $END_MS" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  production:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: ready
    runs-on: [sunrise-dev-frontend]
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    outputs:
      deployment_status: ${{ steps.deliver.outputs.deployment_status }}
    env:
      GH_TOKEN: ${{ github.token }}
      OPERATION: ${{ inputs.operation }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      REVIEWED_MIGRATIONS: ${{ inputs.reviewed_migrations || '' }}
      ROLLBACK_RELEASE: ${{ inputs.release }}
      BUILDX_CONFIG: /opt/sunrise-ci/buildx
      NODE_OPTIONS: --max-old-space-size=1900
    steps:
      - name: Build on the new host and deliver over the VPC
        id: deliver
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/sunrise-ci/node/bin:$PATH"
          result=0
          python3 /usr/local/sbin/sunrise-build-production frontend || result=$?
          if [[ "$result" == 78 ]]; then
            echo 'deployment_status=waiting_migration' >> "$GITHUB_OUTPUT"
          elif [[ "$result" != 0 ]]; then
            exit "$result"
          elif [[ "$OPERATION" == stage ]]; then
            echo 'deployment_status=staged' >> "$GITHUB_OUTPUT"
          else
            echo 'deployment_status=verified' >> "$GITHUB_OUTPUT"
          fi
